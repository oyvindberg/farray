$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: 1.0.0-M10
jvm:
  # match bleep's own JVM; JDK 17 lacks classes google-java-format 1.33.0 needs (JCAnyPattern)
  name: graalvm-community:25.0.1
projects:
  farray:
    extends: template-common
    sourcegen:
      project: codegen
      main: farray.GenCores
    publish:
      groupId: com.olvind.farray
      description: "An immutable, unboxed, Array-backed sequence for Scala 3 with the whole collections API"
      url: https://github.com/oyvindberg/farray
      organization: com.olvind
      sonatypeProfileName: com.olvind
      developers:
        - id: oyvindberg
          name: Øyvind Raddum Berg
          url: https://github.com/oyvindberg
      licenses:
        - name: MIT
          url: http://opensource.org/licenses/MIT
          distribution: repo
  codegen:
    extends: template-common
    dependencies:
      - build.bleep::bleep-core:${BLEEP_VERSION}
  gensets:
    extends: template-common
    dependencies:
      - build.bleep::bleep-core:${BLEEP_VERSION}
  # The NDJSON record decoder as a DOWNSTREAM module: farray ships the fusion engine and the
  # ByteRecordSource contract, this project plugs a concrete decoder into the RecordDecoder seam
  # (discovered reflectively at macro-expansion time). Deliberately an example — the shape of what a
  # user would write for their own record-framed byte format.
  example-json-decoder:
    extends: template-common
    dependsOn: farray
  fset:
    extends: template-common
    dependsOn: farray
    sourcegen:
      project: gensets
      main: farray.GenSets
  fset-tests:
    dependencies:
      - junit:junit:4.13.2
      - com.github.sbt:junit-interface:0.13.2
    dependsOn: fset
    extends: template-common
    isTestProject: true
  # Compiles a representative set of `.fuse` pipelines + `distinctBy`/other inline-op call sites WITH
  # `-Yexplicit-nulls` (the flag the Scala 3 compiler itself is built with). This is a COMPILE-ONLY gate:
  # if the macro/inline-expanded code emits a bare `null` into a non-nullable type it fails to typecheck
  # here, exactly as it did in dotty and blocked all `.fuse` adoption. `bleep compile nulls-tests` must be
  # clean. strict:false isolates the gate to hard type errors (not unrelated warnings).
  nulls-tests:
    dependsOn: farray
    extends: template-common
    scala:
      strict: false
      options: -encoding utf8 -feature -unchecked -Yexplicit-nulls
  # Compiles direct `xs.lazyZip(ys).<terminal>(…)` call sites WITH `-Ycheck:all` (the flag dotty runs
  # its own bootstrap under). Inlining a lazyZip terminal used to lift the `FLazyZip2` marker receiver
  # into a synthetic val whose TypeTree carried no position, tripping "position not set" under
  # -Ycheck:all when the compiler's own sources were recompiled. This COMPILE-ONLY gate reproduces that
  # exact shape; `bleep compile ycheck-tests` must be clean.
  ycheck-tests:
    dependsOn: farray
    extends: template-common
    scala:
      strict: false
      options: -encoding utf8 -feature -unchecked -Ycheck:all
  # Compiles inline-op call sites (groupBy/groupMap/…) WITH `-Werror -deprecation`. An inline body that
  # expands `a -> b` (Predef.ArrowAssoc, deprecated under recent dotty) becomes a hard error at the call
  # site of a `-Werror` codebase (the Scala 3 compiler itself). This COMPILE-ONLY gate catches any such
  # deprecated construct in an inline expansion; `bleep compile werror-tests` must be clean. (Scala 3.8.3
  # does not yet deprecate ArrowAssoc, so this gate only bites once farray is re-pinned to 3.10+; it stays
  # as a general -Werror inline-expansion gate meanwhile.)
  werror-tests:
    dependsOn: farray
    extends: template-common
    scala:
      strict: false
      options: -encoding utf8 -feature -unchecked -deprecation -Werror
  tests:
    dependencies:
      - junit:junit:4.13.2
      - com.github.sbt:junit-interface:0.13.2
      - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core:2.31.3
      - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros:2.31.3
    dependsOn: [farray, example-json-decoder]
    extends: template-common
    isTestProject: true
  benchmarks:
    dependsOn: [farray, example-json-decoder]
    extends: template-common
    dependencies:
      - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core:2.31.3
      - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros:2.31.3
      - org.typelevel::jawn-ast:1.4.0
      - com.fasterxml.jackson.core:jackson-databind:2.17.2
      - org.openjdk.jmh:jmh-generator-bytecode:1.36
      - build.bleep::bleep-core:${BLEEP_VERSION}
      - co.fs2::fs2-core:3.11.0
      - dev.zio::zio:2.1.14
  benchmarks-runner:
    dependsOn: benchmarks
    extends: template-common
    platform:
      mainClass: org.openjdk.jmh.Main
    sourcegen:
      project: benchmarks
      main: farray.GenJmh
  # FSet benchmark suite — a PARALLEL of benchmarks/benchmarks-runner, fully split from the FArray suite:
  # its own sources, its own JMH-generated runner (GenSetJmh → setbenchmarks-runner), and its own set
  # competitor deps. Driven by scripts/setbench-run.sh → docs/set-bench-results.json + docs/set-index.html.
  setbenchmarks:
    dependsOn: [farray, fset]
    extends: template-common
    dependencies:
      - org.openjdk.jmh:jmh-generator-bytecode:1.36
      - build.bleep::bleep-core:${BLEEP_VERSION}
      # ---- set-implementation competitors (versions web-verified) ----
      - org.roaringbitmap:RoaringBitmap:1.6.14
      - it.unimi.dsi:fastutil:8.5.18
      - com.carrotsearch:hppc:0.10.0
      - org.eclipse.collections:eclipse-collections:13.0.0
      - org.eclipse.collections:eclipse-collections-api:13.0.0
      - com.google.guava:guava:33.6.0-jre
  setbenchmarks-runner:
    dependsOn: setbenchmarks
    extends: template-common
    platform:
      mainClass: org.openjdk.jmh.Main
    sourcegen:
      project: setbenchmarks
      main: farray.GenSetJmh
templates:
  template-common:
    platform:
      name: jvm
    scala:
      options: -encoding utf8 -feature -unchecked -opt
      strict: true
      version: 3.8.3
