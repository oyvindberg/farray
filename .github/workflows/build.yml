name: Build
on:
  push:
    tags: [ 'v*' ]
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    timeout-minutes: 15
    # need to be newer than `ubuntu-20.04` because of scalafmt native binary
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Scalafmt Check
        run: bleep fmt --check

      - name: Run tests
        env:
          CI: true
        run: |
          bleep compile
          bleep test

  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [ build ]
    if: "startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: write   # create the GitHub Release for the tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0            # DynVer derives the version from git tags/history
      - uses: bleep-build/bleep-setup-action@0.0.1
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Publish to Sonatype / Maven Central
        run: bleep publish sonatype
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - name: GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ steps.get_version.outputs.version-without-v }}"
          prerelease: true
          generate_release_notes: true
